<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e3a8a">
<title>Leo's Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: #1e3a8a; }
body {
  min-height: 100vh;
  font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
  color: #fff;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,.18) 0 8%, transparent 9%),
    radial-gradient(circle at 85% 20%, rgba(255,255,255,.12) 0 5%, transparent 6%),
    radial-gradient(circle at 70% 90%, rgba(255,255,255,.10) 0 7%, transparent 8%),
    linear-gradient(160deg, #60a5fa 0%, #2563eb 45%, #1e3a8a 100%);
  background-attachment: fixed;
  padding: max(24px, env(safe-area-inset-top)) 16px 40px;
  user-select: none; -webkit-user-select: none;
}
header { text-align: center; margin: 8px auto 28px; }
h1 {
  font-size: clamp(2.4em, 8vw, 4em);
  line-height: 1;
  letter-spacing: 1px;
  text-shadow: 0 5px 0 #1e3a8a, 0 10px 24px rgba(0,0,0,.35);
}
h1 .wiggle { display: inline-block; animation: wiggle 2.4s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) scale(1.1); } }
.tagline { margin-top: 12px; font-size: clamp(1em, 3vw, 1.25em); opacity: .92; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  max-width: 1040px;
  margin: 0 auto;
}
.card {
  position: relative;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 22px 18px 20px;
  border-radius: 26px;
  border: 5px solid #fff;
  color: #fff;
  text-decoration: none;
  background: var(--bg);
  box-shadow: 0 8px 0 var(--edge), 0 14px 28px rgba(0,0,0,.3);
  transition: transform .12s ease, box-shadow .12s ease;
}
.card:hover { transform: translateY(-4px) rotate(-1deg); }
.card:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--edge), 0 6px 12px rgba(0,0,0,.25); }
.card:focus-visible { outline: 5px solid #fde047; outline-offset: 4px; }
.emoji { font-size: 4.6em; line-height: 1.1; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); }
.card:hover .emoji { animation: bounce .5s ease; }
@keyframes bounce { 40% { transform: translateY(-12px) scale(1.08); } }
.name { margin-top: 8px; font-size: 1.6em; font-weight: bold; line-height: 1.1; text-shadow: 0 3px 0 rgba(0,0,0,.2); }
.desc { margin-top: 8px; font-size: 1em; line-height: 1.35; opacity: .95; flex: 1; }
.progress {
  margin-top: 14px; min-height: 1.9em;
  padding: 4px 14px; border-radius: 999px;
  background: rgba(0,0,0,.22); font-size: .95em; font-weight: bold; white-space: nowrap;
}
.progress:empty { visibility: hidden; }
.play {
  margin-top: 14px;
  padding: 8px 30px; border-radius: 999px;
  background: #fff; color: var(--edge);
  font-size: 1.2em; font-weight: bold; letter-spacing: 1px;
}
.badge {
  position: absolute; top: -14px; right: -10px;
  background: #fde047; color: #713f12;
  padding: 4px 12px; border-radius: 999px; border: 3px solid #fff;
  font-size: .85em; font-weight: bold; transform: rotate(8deg);
  box-shadow: 0 4px 10px rgba(0,0,0,.25);
}
footer { text-align: center; margin-top: 36px; opacity: .75; font-size: .9em; }
@media (prefers-reduced-motion: reduce) {
  h1 .wiggle, .card:hover .emoji { animation: none; }
  .card { transition: none; }
}
</style>
</head>
<body>
<header>
  <h1><span class="wiggle">🎮</span> Leo's Games</h1>
  <div class="tagline">Pick a game to play!</div>
</header>

<main class="grid" id="grid"></main>

<footer>Games designed by Leo &middot; built with Claude</footer>

<script>
'use strict';
function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function readJSON(key) { try { return JSON.parse(read(key) || 'null'); } catch (e) { return null; } }

// Add new games here — newest first.
const GAMES = [
  {
    file: 'barrier-battle.html', emoji: '🛡️', name: 'Barrier Battle',
    desc: 'Chop trees, fix your wall and smash the red barrier!',
    bg: 'linear-gradient(160deg, #3b82f6, #dc2626)', edge: '#7f1d1d', badge: 'NEW!',
    progress() {
      const lvl = parseInt(read('leo_barrier_unlocked') || '0', 10);
      if (!lvl) return '';
      const stars = Object.values(readJSON('leo_barrier_stars') || {}).reduce((a, b) => a + b, 0);
      return 'Level ' + lvl + (stars ? ' · ⭐ ' + stars : '');
    },
  },
  {
    file: 'sumo-castle.html', emoji: '🏰', name: 'Sumo Castle Conquest',
    desc: 'Send waves of sumos to capture the red castle!',
    bg: 'linear-gradient(160deg, #f59e0b, #ea580c)', edge: '#9a3412',
    progress() {
      const lvl = parseInt(read('leo_castle_unlocked') || '0', 10);
      return lvl ? 'Level ' + lvl + ' of 100' : '';
    },
  },
  {
    file: 'sumo-smash.html', emoji: '🤼', name: 'Sumo & Ninja',
    desc: 'Punch, kick and knock them out of the ring!',
    bg: 'linear-gradient(160deg, #22c55e, #15803d)', edge: '#14532d',
    progress() {
      const s = readJSON('sumoNinjaSave_v1');
      if (!s || !s.level) return '';
      return 'Level ' + s.level + (s.coins ? ' · 💰 ' + s.coins : '');
    },
  },
  {
    file: 'spelling-bee.html', emoji: '🐝', name: 'Spelling Bee',
    desc: 'Listen to the word and spell it right!',
    bg: 'linear-gradient(160deg, #facc15, #d97706)', edge: '#92400e',
    progress() { return ''; },
  },
];

const grid = document.getElementById('grid');
for (const g of GAMES) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = g.file;
  a.style.setProperty('--bg', g.bg);
  a.style.setProperty('--edge', g.edge);
  let progress = '';
  try { progress = g.progress(); } catch (e) {}
  a.innerHTML =
    (g.badge ? '<span class="badge">' + g.badge + '</span>' : '') +
    '<div class="emoji" aria-hidden="true">' + g.emoji + '</div>' +
    '<div class="name">' + g.name + '</div>' +
    '<div class="desc">' + g.desc + '</div>' +
    '<div class="progress"></div>' +
    '<div class="play">PLAY ▶</div>';
  a.querySelector('.progress').textContent = progress;
  grid.appendChild(a);
}
</script>
</body>
</html>
