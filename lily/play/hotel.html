<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sparkle Suites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #bfe6ff; font-family: Fredoka, system-ui, sans-serif; color: #1f2937; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; left: 0; right: 0; bottom: 0; top: 0; display: block; touch-action: none; cursor: pointer; }
  #hud { position: fixed; left: 8px; right: 8px; top: 62px; z-index: 20; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; pointer-events: none; }
  #hud .chip { background: rgba(255,255,255,.94); border-radius: 999px; padding: 4px 12px; font-size: 17px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #hud .clock { width: 70px; height: 10px; border-radius: 6px; background: #e2e8f0; overflow: hidden; }
  #hud .clock i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #fbbf24, #f97316); }
  #hud .stars { letter-spacing: -2px; }
  #hud .money.bump { animation: hb .35s; }
  @keyframes hb { 50% { transform: scale(1.2); } }
  #hint { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 20; background: rgba(255,255,255,.95); border-radius: 16px; padding: 6px 14px; font-size: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.15); max-width: calc(100vw - 32px); text-align: center; pointer-events: none; transition: opacity .3s; }
  #hint:empty { opacity: 0; }
  #panel { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; background: rgba(30,27,75,.35); padding: 16px; box-sizing: border-box; }
  #panel.on { display: grid; }
  #panel .card { background: #fff; border-radius: 26px; padding: 18px 20px; width: min(460px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; text-align: center; box-shadow: 0 16px 50px rgba(0,0,0,.3); }
  #panel h1 { font-family: 'Baloo 2', Fredoka, sans-serif; margin: 0 0 4px; font-size: 30px; line-height: 1.1; color: #db2777; }
  #panel p { margin: 6px 0; font-size: 17px; line-height: 1.4; }
  #panel table { margin: 8px auto; border-collapse: collapse; font-size: 17px; }
  #panel td { padding: 3px 10px; text-align: left; }
  #panel td + td { text-align: right; font-weight: 600; }
  #panel tr.tot td { border-top: 2px solid #e5e7eb; font-size: 19px; }
  #panel canvas { width: 120px; height: 120px; }
  .bigbtn { border: 0; border-radius: 999px; padding: 12px 22px; margin: 6px 4px 0; font: 700 19px Fredoka, sans-serif; cursor: pointer; color: #fff; background: linear-gradient(90deg, #f472b6, #8b5cf6); box-shadow: 0 4px 12px rgba(139,92,246,.35); }
  .bigbtn.alt { background: linear-gradient(90deg, #34d399, #0ea5e9); box-shadow: 0 4px 12px rgba(14,165,233,.35); }
  .shop-money { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .item { border: 2px solid #e5e7eb; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
  .item .em { font-size: 32px; line-height: 1; }
  .item b { font-size: 17px; }
  .item small { color: #475569; font-size: 14px; line-height: 1.3; flex: 1; }
  .item button { border: 0; border-radius: 999px; padding: 7px 10px; font: 600 16px Fredoka, sans-serif; cursor: pointer; background: #22c55e; color: #fff; }
  .item button:disabled { background: #cbd5e1; cursor: default; }
  .item.owned { background: #f0fdf4; border-color: #86efac; }
  @media (max-width: 640px) {
    #hud { top: 98px; }
    #hud .chip { font-size: 14px; padding: 3px 9px; }
    #hud .clock { width: 44px; }
    #hint { font-size: 14px; }
    #panel h1 { font-size: 24px; }
    .shop-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="chip">📅 <span id="dayTxt">Day 1</span> <span class="clock"><i id="clockBar"></i></span> <span id="timeTxt">8:00</span></div>
  <div class="chip money" id="moneyChip">💵 <span id="moneyTxt">0</span></div>
  <div class="chip"><span class="stars" id="starTxt">⭐⭐⭐</span></div>
</div>
<div id="hint"></div>
<div id="panel"><div class="card" id="panelCard"></div></div>
<script src="park.js"></script>
<script src="hotel.js"></script>
</body>
</html>
